name: Build Soul Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 27.3.13750724

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
        accept-android-sdk-licenses: true

      - name: Install Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app_pojavlauncher:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Soul-Launcher-debug-APK
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
